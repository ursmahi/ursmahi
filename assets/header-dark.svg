<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Mahidhar Kakumani — Founder, Selzix</title>
  <desc id="d">An Instagram handle flows through an AI pipeline into a live Selzix storefront.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12291F" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#C8941F" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C8941F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#07130E" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#07130E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#07130E" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
      .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes flow{to{stroke-dashoffset:-20}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
    </style>
  </defs>

  <rect width="1280" height="340" rx="18" fill="#07130E"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>
  <rect width="760" height="340" rx="18" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="1279" height="339" rx="17.5" fill="none" stroke="#1E3B2F"/>

  <!-- left: identity -->
  <text x="64" y="90" class="mono" font-size="14" letter-spacing="3" fill="#F0C75A">FOUNDER · SELZIX</text>
  <text x="62" y="156" class="sans" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#F4F1E8">Mahidhar Kakumani</text>
  <text x="64" y="204" class="sans" font-size="20" fill="#A9BAB1">I build commerce platforms end to end — from the</text>
  <text x="64" y="232" class="sans" font-size="20" fill="#A9BAB1">Postgres schema to the cluster, for humans <tspan fill="#F4F1E8">and AI agents.</tspan></text>
  <text x="64" y="288" class="mono" font-size="14" fill="#6F8579">TypeScript · Hono · TanStack · Postgres · MCP · Bun</text>

  <!-- right: the Selzix pipeline -->
  <g class="mono" font-size="15">
    <rect x="850" y="62" width="350" height="54" rx="10" fill="#0C1F17" stroke="#1E3B2F"/>
    <text x="872" y="95" fill="#6F8579">instagram</text>
    <text x="1178" y="95" text-anchor="end" fill="#F4F1E8">@yourbrand</text>

    <path d="M1025 116V142" stroke="#C8941F" stroke-width="2" class="flow"/>

    <rect x="850" y="142" width="350" height="54" rx="10" fill="#0C1F17" stroke="#C8941F" stroke-opacity=".7"/>
    <text x="872" y="175" fill="#F0C75A">ai</text>
    <text x="1178" y="175" text-anchor="end" fill="#F4F1E8">infer → design → compose</text>

    <path d="M1025 196V222" stroke="#C8941F" stroke-width="2" class="flow"/>

    <rect x="850" y="222" width="350" height="54" rx="10" fill="#0C1F17" stroke="#1E3B2F"/>
    <circle cx="880" cy="249" r="5" fill="#3DDC84" class="pulse"/>
    <text x="896" y="255" fill="#3DDC84">live</text>
    <text x="1178" y="255" text-anchor="end" fill="#F4F1E8">yourbrand.selzix.com</text>
  </g>
  <text x="1025" y="306" text-anchor="middle" class="sans" font-size="13" fill="#6F8579">minutes, not weeks</text>
</svg>
